[project]
name = "ivr-spike"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = ["fastapi==0.141.1", "uvicorn[standard]", "cryptography"]

[dependency-groups]
dev = ["pytest", "httpx", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 88
