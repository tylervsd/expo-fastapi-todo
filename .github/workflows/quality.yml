name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - run: corepack enable
      - run: corepack prepare pnpm@11.25.0 --activate
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  doctor-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y bats
      - run: bats tests/repository_contract.bats tests/doctor/core.bats tests/doctor/platform_xcode.bats tests/doctor/tooling.bats

  doctor-macos-integration:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: brew install bats-core
      - run: bats tests/doctor/integration.bats

  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: todo_test
          POSTGRES_PASSWORD: todo_test
          POSTGRES_DB: todo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todo_test -d todo_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://todo_test:todo_test@127.0.0.1:5432/todo_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - run: corepack enable
      - run: corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pipx install uv==0.12.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.7
      - run: uv sync --project apps/api --frozen --python 3.14.7
        env:
          UV_PYTHON_DOWNLOADS: never
      - run: pnpm lint:mobile
      - run: pnpm typecheck
      - run: pnpm test:mobile
      - run: pnpm lint:api
      - run: pnpm test:api
      - run: pnpm build:web
