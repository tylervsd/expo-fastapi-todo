name: e2e

# Phase 12 cross-platform E2E: Chromium browser journeys run on pull requests
# and main pushes; iOS Simulator journeys run on main pushes and manual
# dispatch only. No OpenRouter secrets or paid services are used anywhere.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: todo_e2e
          POSTGRES_PASSWORD: todo_e2e
          POSTGRES_DB: todo_e2e
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U todo_e2e -d todo_e2e"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      E2E_DATABASE_URL: postgresql+psycopg://todo_e2e:todo_e2e@127.0.0.1:5434/todo_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - run: corepack enable
      - run: corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pipx install uv==0.12.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.7
      - run: uv sync --project apps/api --frozen --python 3.14.7
        env:
          UV_PYTHON_DOWNLOADS: never
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm typecheck:e2e
      - run: pnpm test:e2e:web
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-web
          path: artifacts/e2e/
          retention-days: 7
          if-no-files-found: warn

  ios:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      E2E_DATABASE_URL: postgresql+psycopg://todo_e2e:todo_e2e@127.0.0.1:5434/todo_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Xcode and Simulator runtime
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          xcodebuild -version | grep -q "Xcode 26" || { echo "e2e ios setup: Xcode 26.x required" >&2; exit 1; }
          xcrun simctl list runtimes | grep -q "iOS 26.5" || { echo "e2e ios setup: iOS 26.5 runtime required" >&2; exit 1; }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - run: corepack enable
      - run: corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pipx install uv==0.12.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.7
      - run: uv sync --project apps/api --frozen --python 3.14.7
        env:
          UV_PYTHON_DOWNLOADS: never
      - name: Provision PostgreSQL 18.6 (job-owned cluster, no service containers on macOS)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/e2e/ios"
          brew install postgresql@18
          PGBIN="$(brew --prefix postgresql@18)/bin"
          echo "$PGBIN" >> "$GITHUB_PATH"
          "$PGBIN/postgres" --version
          "$PGBIN/postgres" --version | grep -q "18\.6" || { echo "e2e ios setup: PostgreSQL 18.6 required, refusing substitute" >&2; exit 1; }
          "$PGBIN/initdb" -D "$RUNNER_TEMP/pg-e2e" -U postgres --auth=trust
          "$PGBIN/pg_ctl" -D "$RUNNER_TEMP/pg-e2e" -o "-c listen_addresses=127.0.0.1 -p 5434" -l "$GITHUB_WORKSPACE/artifacts/e2e/ios/postgres.log" start
          "$PGBIN/psql" -h 127.0.0.1 -p 5434 -U postgres -d postgres -c "CREATE ROLE todo_e2e LOGIN PASSWORD 'todo_e2e';" -c "CREATE DATABASE todo_e2e OWNER todo_e2e;"
          "$PGBIN/psql" -h 127.0.0.1 -p 5434 -U todo_e2e -d todo_e2e -tAc 'SELECT version();'
      - name: Install Maestro 2.10.0 (requires java on PATH first)
        run: |
          export JAVA_HOME="$(/usr/libexec/java_home -v 17)"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          JAVA_VERSION="$(java -version 2>&1 | sed -n 's/.*version "\([^"]*\)".*/\1/p' | head -1)"
          case "$JAVA_VERSION" in 17.0.20|17.0.20.*) ;; *) echo "e2e ios setup: pinned Java 17.0.20 required (found $JAVA_VERSION), refusing substitute" >&2; exit 1; esac
          curl -Ls "https://get.maestro.mobile.dev" | MAESTRO_VERSION=2.10.0 bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro --version
      - name: Select iOS 26.5 Simulator device
        run: |
          [ "$(pod --version)" = "1.17.0" ] || { echo "e2e ios setup: pinned CocoaPods 1.17.0 required, refusing substitute" >&2; exit 1; }
          UDID=$(xcrun simctl list devices available --json | python3 -c "import json,sys; ds=json.load(sys.stdin)['devices']; print(next(d['udid'] for k in ds for d in ds[k] if 'iOS-26-5' in k and d['name']=='iPhone 17' and d['isAvailable']))")
          echo "Selected Simulator UDID: $UDID"
          echo "E2E_SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
      - run: pnpm test:e2e:ios
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-ios
          path: artifacts/e2e/
          retention-days: 7
          if-no-files-found: warn
