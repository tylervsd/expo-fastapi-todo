services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 2s
      timeout: 3s
      retries: 15

  db-test:
    image: postgres:18.6
    profiles: [test]
    environment:
      POSTGRES_USER: todo_test
      POSTGRES_PASSWORD: todo_test
      POSTGRES_DB: todo_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_test -d todo_test"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
