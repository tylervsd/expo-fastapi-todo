[project]
name = "expo-fastapi-todo-api"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
  "ag-ui-protocol==0.1.22",
  "alembic>=1.18,<1.19",
  "argon2-cffi>=23.1,<26",
  "fastapi==0.141.1",
  "google-cloud-kms==3.16.0",
  "google-cloud-tasks==2.24.0",
  "google-crc32c>=1.7,<2",
  "httpx",
  "opentelemetry-api>=1.44,<1.45",
  "opentelemetry-exporter-gcp-trace>=1.15,<1.16",
  "opentelemetry-sdk>=1.44,<1.45",
  "psycopg[binary]>=3.3,<3.4",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn[standard]",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88
