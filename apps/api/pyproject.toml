[project]
name = "expo-fastapi-todo-api"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]",
]

[dependency-groups]
dev = ["httpx", "pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88
