appId: ${APP_ID}
---
- launchApp
# Load gate (see guided-resume-confirm.yaml): the step resume entry
# renders only after the saved workflows fetch resolves.
- extendedWaitUntil:
    visible: "Organize supplies, Break it into smaller todos"
    timeout: 15000
- tapOn: "Organize supplies, Break it into smaller todos"
- extendedWaitUntil:
    visible:
      id: "e2e-collect-titles"
    timeout: 15000
- tapOn:
    id: "e2e-collect-titles"
- eraseText: 100
- tapOn:
    id: "e2e-collect-titles"
- inputText: "Gather reusable supplies\nPrepare workspace"
- tapOn:
    id: "e2e-save-tasks"
- extendedWaitUntil:
    visible:
      id: "e2e-confirm-plan"
    timeout: 15000
