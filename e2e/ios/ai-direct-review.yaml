appId: ${APP_ID}
---
- launchApp
- tapOn:
    id: "e2e-help-plan"
- tapOn:
    id: "e2e-task-title"
- inputText: "Organize supplies"
- hideKeyboard
- tapOn:
    id: "e2e-start-planning"
- extendedWaitUntil:
    visible: "Does this task involve multiple steps?"
    timeout: 15000
- tapOn:
    id: "e2e-workflow-action-Yes"
- extendedWaitUntil:
    visible: "Would you like to split it into smaller todos?"
    timeout: 15000
- tapOn:
    id: "e2e-workflow-action-Yes"
- extendedWaitUntil:
    visible:
      id: "e2e-collect-titles"
    timeout: 15000
- tapOn:
    id: "e2e-suggest-todos"
- extendedWaitUntil:
    visible: "Saved suggestions are ready to review."
    timeout: 20000
