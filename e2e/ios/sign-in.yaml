appId: ${APP_ID}
---
- clearState
- clearKeychain
- launchApp
- extendedWaitUntil:
    visible:
      id: "e2e-auth-username"
    timeout: 15000
- tapOn:
    id: "e2e-auth-username"
- inputText: "${USERNAME}"
- tapOn:
    id: "e2e-auth-password"
- inputText: "${PASSWORD}"
- tapOn:
    id: "e2e-auth-submit"
# iOS may present a system "Save Password?" sheet on top of the app after
# sign-in. Dismiss it only when present; the runFlow condition skips
# otherwise. Checked twice to cover sheets that surface a beat late.
- runFlow:
    file: ./dismiss-save-password.yaml
    when:
      visible: "Not Now"
- extendedWaitUntil:
    visible: "Todos"
    timeout: 15000
- runFlow:
    file: ./dismiss-save-password.yaml
    when:
      visible: "Not Now"
- extendedWaitUntil:
    visible:
      id: "e2e-todo-title"
    timeout: 15000
# Fresh accounts start empty; the empty-state text proves the UI session
# belongs to the newly seeded account rather than a stale one.
- extendedWaitUntil:
    notVisible: "Loading todos…"
    timeout: 15000
- assertVisible: "No todos yet. Add one above."
